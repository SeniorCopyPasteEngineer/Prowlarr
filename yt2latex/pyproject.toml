[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt2latex"
version = "1.0.0"
description = "Turn a YouTube lecture into rigorous LaTeX study notes and a compiled PDF using Gemini 3.7 Flash."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["google-genai>=1.30.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
yt2latex = "yt2latex.cli:main"

[tool.setuptools.packages.find]
include = ["yt2latex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
